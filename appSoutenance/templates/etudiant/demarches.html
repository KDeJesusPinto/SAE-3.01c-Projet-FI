{% extends "base.html" %}

{% block navbar %}
    <div class="boite_horizontale">
        <div class="boite_horizontale">
            <p>{{ prenom }}<br>{{ nom }}</p>
            <i class="fas fa-user-circle petite_icone"></i>
        </div>
        <i class="fas fa-sign-out-alt petite_icone"></i>
    </div>
{% endblock %}


{% block content %}
    <div class="boite_verticale demarches">
        <div class="boite_horizontale">
            <h1>Mes démarches</h1>
            <a href="{{ url_for('nouvelle_demarches_etudiant') }}"><i class="fas fa-plus-circle grande_icone"></i></a>        
        </div>
        {% for (num, infos) in liste_dem.items() %}
            <div class="glass boite_horizontale">
                <h2>Démarche n°{{ num }}</h2>
                <div class="boite_verticale">
                    <i class="fas fa-building petite_icone"></i>
                    <p class="short">{{ infos[0] }}</p>
                </div>
                <div class="boite_verticale">
                    <i class="fas fa-clock petite_icone"></i>
                    <p class="short">{{ infos[1] }} semaines</p>
                </div>
                <div class="boite_verticale">
                    <i class="fas fa-clipboard-list petite_icone"></i>
                    <span class="tooltip short" data-tooltip="État : {{ infos[2] }}">État : {{ infos[2] }}</span>
                </div>
                <div class="boite_verticale">
                    <a href="{{ url_for('resume_demarches_etudiant') }}" class="petit_bouton">Résumé</a>
                    <a href="" class="petit_bouton">Modifier</a>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
